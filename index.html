<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>重叙日 · 叙事者篇章之战</title>
    <meta name="description" content="重叙日 - 暗黑哥特风隐藏阵营卡牌对战游戏" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical first-screen resources -->
    <link rel="preload" as="image" href="./images/main-menu-official.jpg" />
    <link rel="preload" as="audio" href="./audio/bgm-main.mp3" />

    <!--
      关键字体，随首屏一起加载。

      书法体（Ma Shan Zheng / Liu Jian Mao Cao / Long Cang）此前被归进了
      requestIdleCallback 的"非关键"批次，所以每次进游戏都要等一会儿才
      从 Noto Serif SC 跳成书法体 —— 而这些书法体恰恰是所有中文标题的样子，
      是这个游戏视觉识别的核心，不该被降级。现在提到首屏一起请求。

      注：Google Fonts 对中文字体做了 unicode-range 分片，
      只会下载页面真正用到的那几片，不是整套字库。

      display=swap 保证字体没到之前先用回退字体渲染，不出现空白文字。
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Noto+Serif+SC:wght@400;500;600;700;800;900&family=Ma+Shan+Zheng&family=Liu+Jian+Mao+Cao&family=Long+Cang&display=swap"
      rel="stylesheet"
    />

    <!--
      字体就绪后给 <html> 打标记，需要的组件可以据此做淡入，
      避免书法体替换瞬间的跳字。
    -->
    <script>
      (function () {
        if (!document.fonts || !document.fonts.ready) return;
        document.fonts.ready.then(function () {
          document.documentElement.classList.add("fonts-ready");
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      纯装饰性的拉丁字体（哥特花体、衬线小标题）延后加载。
      它们只出现在英文副标题上，晚一点到不影响阅读。
    -->
    <script type="module">
      var loadDecorative = function () {
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href =
          "https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=UnifrakturCook:wght@700&family=UnifrakturMaguntia&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Marcellus&display=swap";
        document.head.appendChild(link);
      };
      // requestIdleCallback 在部分 Safari 上不存在，
      // 之前没做保护 —— 一旦抛错，所有装饰字体都不会加载。
      if (typeof requestIdleCallback === "function") {
        requestIdleCallback(loadDecorative, { timeout: 2000 });
      } else {
        setTimeout(loadDecorative, 1200);
      }
    </script>
  </body>
</html>
